<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Card</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: url('https://upload.wikimedia.org/wikipedia/commons/8/82/Marc%2C_Franz_-_Blue_Horse_I_-_Google_Art_Project.jpg') no-repeat center center/cover;
      font-family: Arial, sans-serif;
    }

    .card {
      position: relative;
      width: 80%;
      max-width: 500px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    .text-box {
      position: absolute;
      width: 60%;
      height: 30%;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #000;
      font-weight: 900;
      font-size: 1.2rem;
      padding: 40px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .text-box:hover,
    .text-box:active {
      background: var(--contrast-bg, #000);
      color: var(--contrast-color, #fff);
    }

    .toggle-mode {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.6);
      border: none;
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: background 0.3s ease;
    }

    .toggle-mode:hover {
      background: rgba(255, 255, 255, 1);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="text-box" id="text-box">
      <p>This is a placeholder text. Hover or press to toggle high contrast.</p>
    </div>
    <button class="toggle-mode" id="toggle-mode">
      <i class="fas fa-adjust"></i>
    </button>
  </div>
  <script>
    const textBox = document.getElementById('text-box');
    const toggleModeButton = document.getElementById('toggle-mode');
    let isDarkMode = true;

    toggleModeButton.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      document.documentElement.style.setProperty('--contrast-bg', isDarkMode ? '#000' : '#fff');
      document.documentElement.style.setProperty('--contrast-color', isDarkMode ? '#fff' : '#000');

      // Update text-box immediately to reflect the mode
      if (isDarkMode) {
        textBox.style.color = '#fff';
      } else {
        textBox.style.color = '#000';
      }
    });

    textBox.addEventListener('mousedown', () => {
      textBox.style.background = getComputedStyle(document.documentElement).getPropertyValue('--contrast-bg');
      textBox.style.color = getComputedStyle(document.documentElement).getPropertyValue('--contrast-color');
    });

    textBox.addEventListener('mouseup', () => {
      textBox.style.background = 'rgba(255, 255, 255, 0.2)';
      textBox.style.color = '#000';
    });
  </script>
</body>
</html>
